# Local Prometheus for the `observability` compose profile.
# Production scrape configuration is Kubernetes service discovery, this file
# exists so the dashboards and alert rules in this repo can be exercised for real.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The application. It runs on the host (`uvicorn app.main:app`) rather than in compose —
  # there is no app image yet — so the container reaches it through the host gateway.
  - job_name: content-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: scalable-content-platform

  # Every app replica under the `scale` profile. Compose publishes an A record per container
  # for the service name, so this job grows and shrinks with `--scale app=N` and resolves to no
  # targets when the profile is down. Do not scrape through nginx: it round-robins, which folds
  # three replicas' counters into one series that looks plausible and is wrong.
  - job_name: content-platform-replicas
    metrics_path: /metrics
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8000
    relabel_configs:
      # dns_sd_configs carries no static labels, so the dashboards' `service` filter is set here.
      - target_label: service
        replacement: scalable-content-platform

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
