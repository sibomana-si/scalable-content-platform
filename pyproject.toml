# Tooling configuration only — no [build-system]; the app runs from the repo root
# (`uvicorn app.main:app`, `pytest`, `ruff .`) with no packaging/editable install.

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]  # flat layout: put repo root on sys.path so `import app` resolves
testpaths = ["tests"]
markers = [
    "integration: requires live MySQL/Redis containers (docker compose up locally; CI service containers)",
    "chaos: requires toxiproxy behind the compose chaos profile (docker compose --profile chaos up -d); skipped when the control port is closed",
    "scale: requires the app image and the compose scale profile (docker compose --profile scale up -d --build --scale app=3); skipped in CI, which does not build the image",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
