# Round-robin load balancer for the local multi-replica test.
#
# Round robin, not least-connections and not ip_hash: the point of the test is that any
# replica can answer any request. Sticky routing would hide exactly the bug the test looks
# for.

server {
    listen 80;

    # Docker's embedded DNS. Naming it is what makes the runtime resolution below possible —
    # without a `resolver`, nginx refuses to resolve a name it did not resolve at startup.
    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        # A variable in proxy_pass, deliberately. An `upstream` block with `server app:8000`
        # resolves once at config load and keeps the first address forever, so every request
        # lands on one replica and the deployment only looks load balanced. Resolving through
        # a variable re-reads Docker DNS, which returns every replica's address and rotates
        # them, so the requests actually spread.
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bounded, so a stalled replica returns 504 rather than holding the client.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Try the next address when one refuses or times out, so a single dying replica does
        # not fail the request.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
