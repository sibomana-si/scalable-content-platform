name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Prefer the project's pinned dev deps once they exist; fall back to ruff.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install ruff; fi
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: content_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DB: content_platform_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
      - name: Run pytest
        # Integration tests run here because this job provisions MySQL/Redis services.
        # The 80% coverage floor is enforced via `[tool.coverage.report] fail_under = 80`
        # in pyproject.toml, so this --cov=app run gates automatically (no CLI flag needed).
        run: pytest --maxfail=1 -q --cov=app --cov-report=term

  # Builds the application image and runs the `scale` suite against three replicas behind
  # nginx. The `test` job above cannot do this: it runs the app in-process, so an image that
  # does not start or a balancer that pins one replica passes there unseen.
  scale:
    name: Scale-out (image + 3 replicas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner reaches the compose stack on its published ports. These values match
      # docker-compose.yml, not the `test` job's service containers.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3307"
      MYSQL_DB: content_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      REDIS_URL: redis://localhost:6379/0
      # Only lets the pytest process load its settings. The replicas sign with the compose
      # value, and the test gets its token through the balancer, so the two need not match.
      JWT_SECRET: ci-scale-runner-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start MySQL and Redis
        run: docker compose up -d --wait mysql redis
      - name: Apply migrations
        # Migrations do not run at container start, so the runner applies them once.
        run: alembic upgrade head
      # The layer cache. A cold build compiles wheels and installs build-essential, and the
      # cache lets an unchanged requirements set skip both.
      - uses: docker/setup-buildx-action@v3
      - name: Expose the Actions runtime to the gha cache
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Build the image and start three replicas behind nginx
        # The documented local command, so CI and a laptop build the image the same way. The
        # CI override adds only the layer cache. --wait blocks on the image HEALTHCHECK and
        # the nginx healthcheck.
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: docker compose --profile scale up -d --build --wait --scale app=3
      - name: Run the scale suite
        run: pytest -m scale -q -rs --junitxml=scale-results.xml
      - name: Fail on any skipped scale test
        # A skip here means the stack did not come up or nginx did not spread the load. Both
        # are the bugs this job exists to catch, so a skip fails the job.
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          
          root = ET.parse("scale-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"scale: {tests} collected, {skipped} skipped")
          sys.exit(1 if tests == 0 or skipped else 0)
          EOF
      - name: Show container logs
        if: failure()
        run: docker compose --profile scale logs --no-color app nginx mysql redis

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
      - name: Build docs site
        run: mkdocs build --strict
