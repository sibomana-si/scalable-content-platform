# Local dependency services for development and integration tests.
# Mirrors the MySQL/Redis service containers in .github/workflows/ci.yml.
#
#   docker compose up -d                                        # mysql + redis only
#   docker compose --profile observability up -d                # + prometheus + grafana
#   docker compose --profile scale up -d --build --scale app=3  # + app replicas behind nginx
#   docker compose --profile load run --rm k6 run /scripts/selftest.js   # the load generator
#   docker compose --profile chaos up -d                        # + toxiproxy, the fault injector
#
# Everything beyond mysql and redis sits behind a profile, so a plain `docker compose up -d`
# stays exactly what the integration suite requires and nothing more.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: content_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle # POST /-/reload after editing alerts.yml
      # k6 pushes client-side latency here, so the load generator's numbers share a time axis
      # with cache_hits_total and db_pool_connections. Without this the push 404s.
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # The app runs on the host (`uvicorn app.main:app`), not in compose — there is no app
    # image until the deployment milestone — so the scrape target resolves via the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [observability]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Local only. There is nothing to protect here and a login prompt just slows the loop.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # --- scale profile: the app itself, replicated behind a load balancer ---
  #
  # Only for `pytest -m scale`. The integration suite runs the app in-process against the
  # containers above; this exists to prove the same behaviour across real, separate replicas.
  app:
    build: .
    profiles: [scale]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: content_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      REDIS_URL: redis://redis:6379/0
      # Run A of the load matrix is the uncached baseline. An env var, not an edit, so the
      # matrix script can flip it between runs and the file stays the same for every run.
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      # Local only, and the same across replicas on purpose: a token minted by one replica
      # must verify on another, which is the property the scale test checks.
      JWT_SECRET: local-scale-test-secret-not-for-production
      LOG_FORMAT: console
    # No ports: nginx is the only way in, so the test cannot accidentally address one replica.
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    profiles: [scale]
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/scale.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- load profile: the k6 load generator (M6) ---
  #
  # Runs on demand (`run --rm`), never `up`. See docs/performance/load-test-runbook.md.
  k6:
    image: grafana/k6:0.57.0
    profiles: [load]
    # The eight E-cores. The generator shares this laptop with the system under test, so its CPU
    # cost is measurement error: pinning it here leaves all six P-cores to MySQL, Redis and the
    # app replicas. Widen the set only if `dropped_iterations` shows the generator starved, and
    # say so in the report.
    cpuset: "${K6_CPUSET:-12-19}"
    # The image runs as uid 12345, which cannot write a bind mount owned by the host user, and
    # the summary file is the whole point of the run.
    user: "${K6_UID:-1000}:${K6_GID:-1000}"
    volumes:
      - ./tests/load:/scripts:ro
      - ./docs/performance/results:/results
    # So a run can target a uvicorn on the host as well as the in-compose nginx.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: ${BASE_URL:-http://nginx:80}
      RUN_ID: ${RUN_ID:-adhoc}
      RESULTS_DIR: /results
      # Where the seeded id block begins. AUTO_INCREMENT does not restart at 1 after a
      # delete, so a generator that assumes 1..N reads ids that do not exist.
      ARTICLE_ID_MIN: ${ARTICLE_ID_MIN:-1}
      # Used only when a run adds `-o experimental-prometheus-rw`.
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),max"

  # --- chaos profile: the fault injector (M7) ---
  #
  # Toxiproxy sits between the application and each dependency, so a fault is injected at the
  # network and not by stopping a container. Stopping MySQL is a blunt instrument: it cannot
  # express "slow" and it loses the data. See docs/resilience/chaos-test-runbook.md.
  #
  # Point the application at the proxy ports for a chaos run:
  #   MYSQL_PORT=23306 REDIS_URL=redis://localhost:26379/0 uvicorn app.main:app
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [chaos]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The proxies are declared in a file, so `inject_fault.py` only ever manages toxics. A
    # missing proxy then fails at start-up rather than in the middle of an experiment.
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    # The six P-cores, beside the service it proxies and away from the eight E-cores k6 owns.
    # An injector that floats across all 20 threads competes with the generator, and the run
    # then measures the contention rather than the fault.
    cpuset: "${TOXIPROXY_CPUSET:-0-11}"
    ports:
      - "8474:8474"   # the control API that scripts/inject_fault.py drives
      - "23306:23306" # MySQL through the proxy
      - "26379:26379" # Redis through the proxy
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro

volumes:
  prometheus-data:
  grafana-data:
